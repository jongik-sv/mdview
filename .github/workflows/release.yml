name: Release

# Push a tag like v0.1.0 to trigger a multi-platform build and a published GitHub Release.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest      # Intel
            args: --target x86_64-apple-darwin
          - platform: windows-latest    # x64 (MSI + NSIS)
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install

      # 릴리스 본문은 CHANGELOG.md의 해당 버전 항목이다. tauri-action이 이 글을
      # latest.json의 notes 로도 넣기 때문에, 업데이터가 "무엇이 바뀌는지"를
      # 설치 전에 그대로 보여줄 수 있다.
      - name: Release notes from CHANGELOG
        shell: bash
        run: |
          {
            echo 'RELEASE_BODY<<RELEASE_NOTES_EOF'
            node scripts/release-notes.mjs "${{ github.ref_name }}"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 업데이터 아티팩트 서명 (tauri.conf.json pubkey와 쌍) — latest.json도
          # tauri-action이 생성·업로드한다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: mdview ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
